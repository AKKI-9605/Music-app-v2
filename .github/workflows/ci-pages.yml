name: Test and deploy Music App

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: music-app-pages
  cancel-in-progress: true

jobs:
  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm test

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-app-test-results
          path: |
            artifacts/screenshots/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  publish-screenshots:
    name: Publish README screenshots
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download browser screenshots
        uses: actions/download-artifact@v4
        with:
          name: music-app-test-results
          path: .

      - name: Commit refreshed screenshots
        run: |
          mkdir -p docs/screenshots
          cp artifacts/screenshots/player-desktop.png docs/screenshots/
          cp artifacts/screenshots/player-mobile.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/player-desktop.png docs/screenshots/player-mobile.png
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
          else
            git commit -m "docs: refresh player screenshots"
            git push origin HEAD:main
          fi

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-screenshots
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
